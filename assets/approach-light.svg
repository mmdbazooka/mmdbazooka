<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="473" viewBox="0 0 1200 473" fill="none" role="img" aria-labelledby="title desc">
<title id="title">How I approach frontend work</title><desc id="desc">Give components clear responsibilities and keep feature behavior easy to follow. Treat loading, empty, and error states as part of the feature. Think through the full user journey, including mobile and RTL/LTR behavior. Make implementation choices understandable to the next developer.</desc>
