<svg xmlns="http://www.w3.org/2000/svg" width="600" height="767" viewBox="0 0 600 767" fill="none" role="img" aria-labelledby="title desc">
<title id="title">How I approach frontend work</title><desc id="desc">Give components clear responsibilities and keep feature behavior easy to follow. Treat loading, empty, and error states as part of the feature. Think through the full user journey, including mobile and RTL/LTR behavior. Make implementation choices understandable to the next developer.</desc>
<defs><radialGradient id="glow"><stop stop-color="#425BFF" stop-opacity=".12"/><stop offset="1" stop-color="#425BFF" stop-opacity="0"/></radialGradient><clipPath id="clip"><rect x="1" y="1" width="598" height="765" rx="22"/></clipPath></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect x="1" y="1" width="598" height="765" rx="22" fill="#10141C" stroke="#30384A"/>
<g clip-path="url(#clip)"><circle cx="560" cy="0" r="330" fill="url(#glow)"/><text x="36" y="43" fill="#91A1FF" font-size="20" font-weight="700" letter-spacing="1">05 / ENGINEERING PRINCIPLES</text><text x="36" y="99" fill="#F3F3EE" font-size="34" font-weight="700" letter-spacing="0">How I approach frontend work</text><rect x="36" y="136" width="45" height="45" rx="10" fill="#171F2C" stroke="#30384A"/><text x="45" y="166" fill="#91A1FF" font-size="21" font-weight="700" letter-spacing="0">01</text><text x="103" y="167" fill="#B0B9CA" font-size="28" font-weight="400" letter-spacing="0">Give components clear</text><text x="103" y="209" fill="#B0B9CA" font-size="28" font-weight="400" letter-spacing="0">responsibilities and keep feature</text><text x="103" y="251" fill="#B0B9CA" font-size="28" font-weight="400" letter-spacing="0">behavior easy to follow.</text><path d="M103 289H564" stroke="#30384A"/><rect x="36" y="295" width="45" height="45" rx="10" fill="#171F2C" stroke="#30384A"/><text x="45" y="325" fill="#91A1FF" font-size="21" font-weight="700" letter-spacing="0">02</text><text x="103" y="326" fill="#B0B9CA" font-size="28" font-weight="400" letter-spacing="0">Treat loading, empty, and error states</text><text x="103" y="368" fill="#B0B9CA" font-size="28" font-weight="400" letter-spacing="0">as part of the feature.</text><path d="M103 406H564" stroke="#30384A"/><rect x="36" y="412" width="45" height="45" rx="10" fill="#171F2C" stroke="#30384A"/><text x="45" y="442" fill="#91A1FF" font-size="21" font-weight="700" letter-spacing="0">03</text><text x="103" y="443" fill="#B0B9CA" font-size="28" font-weight="400" letter-spacing="0">Think through the full user journey,</text><text x="103" y="485" fill="#B0B9CA" font-size="28" font-weight="400" letter-spacing="0">including mobile and RTL/LTR</text><text x="103" y="527" fill="#B0B9CA" font-size="28" font-weight="400" letter-spacing="0">behavior.</text><path d="M103 565H564" stroke="#30384A"/><rect x="36" y="571" width="45" height="45" rx="10" fill="#171F2C" stroke="#30384A"/><text x="45" y="601" fill="#91A1FF" font-size="21" font-weight="700" letter-spacing="0">04</text><text x="103" y="602" fill="#B0B9CA" font-size="28" font-weight="400" letter-spacing="0">Make implementation choices</text><text x="103" y="644" fill="#B0B9CA" font-size="28" font-weight="400" letter-spacing="0">understandable to the next</text><text x="103" y="686" fill="#B0B9CA" font-size="28" font-weight="400" letter-spacing="0">developer.</text></g></svg>